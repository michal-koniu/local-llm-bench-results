# llama-swap - centralny widok i serwowanie modeli lokalnych
#
# WAZNE: kazdy model startuje TWOIM llama-server (build GGML_HIP=ON,
# GPU_TARGETS=gfx1201). Zadnego obcego runtime'u - dzieki temu to, co serwujesz,
# jest dokladnie tym, co mierzysz stelazem pomiarowym. Aktualny commit: 680a036
# (przebudowany 28 IX 2026, poprzednio 987498f -- patrz TECHNIKA.md).
#
# Przeglad i optymalizacja: 30 IX 2026. Poprzednia wersja:
# config.yaml.bak-20260930-przed-optymalizacja. Co sie zmienilo i dlaczego:
#   * --agent dla KAZDEGO modelu (makro ${server}): wszystkie wbudowane narzedzia
#     llama-server (read_file, file_glob_search, grep_search, exec_shell_command,
#     write_file, edit_file, get_info) + proxy CORS dla serwerow MCP. Wywolania
#     narzedzi przez API (OpenAI "tools") dzialaja przez --jinja (domyslnie wlaczone).
#     UWAGA: exec_shell_command wykonuje polecenia jako mkoniu na tej maszynie, a
#     llama-swap slucha na 0.0.0.0:8080 BEZ hasla -- kazdy w tej sieci LAN moze tego
#     uzyc. Patrz sekcja "Bezpieczenstwo" w SERWOWANIE-MODELI.md.
#   * -fa on (flash attention) jawnie: sprawdzone, ze wszystkie 8 modeli GPU dzialaja.
#   * --ubatch-size dobrany POMIAREM dla kazdego modelu osobno (llama-bench, prompt
#     4096 tokenow, 256/512/1024/2048/4096, 2 powtorzenia; zasada: najmniejsza
#     wartosc w granicach 2 % od najlepszej -- wiekszy ubatch zjada VRAM na kontekst).
#     Domyslne 512 nigdy nie bylo najlepsze: +3 % (qwen3-32b) do +57 % (qwen3-235b).
#     Za duzy tez szkodzi: DeepSeek przy 4096 traci 58 % wzgledem 1024.
#     --batch-size musi byc >= ubatch (domyslne 2048).
#   * --ctx-size podniesione do natywnego maksimum modelu tam, gdzie miesci sie w VRAM
#     przy 4 kartach (kazdy wpis sprawdzony zaladowaniem przez llama-swap).
#
# Domyslnie llama-swap trzyma JEDEN model naraz i przelacza na zadanie -- modele
# nie dziela kart, bo nigdy nie dzialaja jednoczesnie. Kazdy wpis ma
# HIP_VISIBLE_DEVICES ustawione na NAJMNIEJ kart, na ktorych model sie miesci:
# wiecej kart przy -sm layer = wiecej przekazan miedzy kartami = wolniejsze
# generowanie, a nie szybsze.
#
# UWAGA na skladnie: w llama-server/llama-cli --tensor-split pisze sie PRZECINKAMI
# (1,1,1,1). W llama-bench -- UKOSNIKAMI (1/1/1/1), bo tam przecinek oznacza
# "przetestuj kilka wartosci". To ta pomylka stala za "bledem llama-bench + dio".
#
# ttl = sekundy bezczynnosci, po ktorych model jest zwalniany i VRAM wraca.
#
# healthCheckTimeout: duze modele (dio) moga potrzebowac >120 s zanim /health
# zwroci 200. 300 s zostawione celowo.
healthCheckTimeout: 900
#
# 4 karty R9700 (30 IX 2026, rocminfo + amd-smi):
#   0 = 0000:03:00.0 (x8), 1 = 0000:06:00.0 (x4), 2 = 0000:09:00.0 (x8), 3 = 0000:19:00.0 (x4).
# iGPU Raphael (0000:1a:00.0) jest index 4. NIGDY nie wpisuj go do HIP_VISIBLE_DEVICES.

macros:
  server: "/home/mkoniu/llama.cpp/build/bin/llama-server --port ${PORT} --jinja --agent -fa on --ui-config-file /home/mkoniu/.config/llama-swap/ui-defaults.json"

models:
  # Bielik 11B v3.0 (dense, polski). ubatch 2048: +8 % promptu vs 512.
  # Narzedzia: wbudowany szablon Bielika NIE obsluguje "tools" (model odpowiadal
  # zwyklym tekstem). Szablon Hermes-3 z JEDNA zmiana (spacja po <tool_call>, bo
  # Bielik zawsze ja wstawia) -> wywolania narzedzi dzialaja, PL i EN, wieloetapowo.
  # Ograniczenia (30 IX): tool_choice "required" konczy sie bledem llama.cpp
  # ("Failed to initialize samplers") -- "auto" dziala; Bielik bywa nadgorliwy
  # (wola narzedzie tez przy pytaniu "ile to 2+2"). Do agentow lepszy gpt-oss/qwen.
  "bielik-11b":
    name: "#4 Bielik 11B - Polish (llama.cpp Vulkan, 1 GPU)"
    description: "Polish-language model (dense 11B, Q8_0) for Polish text. GPU 0. ~48 tok/s (37 at 14k ctx). 32k ctx. Starts in seconds. Unloads everything else."
    # context+skills source (auto-detect): ~/.config/llama-swap/AGENT_BOOTSTRAP.md + ~/ai_skills/INDEX.md
    cmd: |
      /home/mkoniu/llama.cpp-0ce8cd1-vulkan/build/bin/llama-server --port ${PORT} --jinja --agent -fa on --ui-config-file /home/mkoniu/.config/llama-swap/ui/bielik-11b.json --tools all --mcp-servers-config /home/mkoniu/.config/llama-swap/tools/mcp-web.json --cors-origins http://192.168.0.39:8080,http://localhost:8080,http://127.0.0.1:8080
      -m /home/mkoniu/models/bielik-11b/Bielik-11B-v3.0-Instruct.Q8_0.gguf
      -ngl 999 --ctx-size 32768 --load-mode dio
      --ubatch-size 2048
      --chat-template-file /home/mkoniu/.config/llama-swap/templates/bielik-11b-tools.jinja
    env:
      - "GGML_VK_VISIBLE_DEVICES=0"
    ttl: 600
    aliases:
      - "bielik"

  # ---------------------------------------------------------------------------------------------
  # ZAPAS (28 X): glowna wersja to "qwen3.8-flash-next" na silniku radiance (nizej), ~3x szybsza.
  # Tutaj 28 X: draft MTP 4 -> 2 (+12 %); realnie (temp 1.0) 41-50 tok/s -- stare ~70 bylo srednia z temp 0.
  # Qwen3.8-Flash-Next (27 X 2026). NAJMADRZEJSZY model na tej maszynie (Qwen: SWE-bench Pro 62.5
  # vs 56.0 DeepSeek-V4-Flash-0731). 125B MoE / 6B aktywnych + 51B tablica n-gramow + glowica MTP.
  # Architektura qwen4exp (podglad Qwen4): Gated DeltaNet + rzadka uwaga QSA + hyper-connections.
  # Unsloth UD-Q5_K_XL, 147 GiB na dysku; tablica n-gramow (50.7 GiB) zostaje w RAM (czytana leniwie,
  # wiersz na token), w VRAM ~96 GiB. llama.cpp NOWY (e86f5fd, 27 X) -- ma polaczone jadra QSA.
  # DLACZEGO ~70, a nie 100+ tok/s: llama.cpp uruchamia ~3400 malych jader GPU na token; kazde kosztuje
  # kilka us niezaleznie od rozmiaru (profil rocprofv3). Bez draftu 36 tok/s i to SAMO w trybie tensor,
  # warstwy, Vulkan, Q4_K_XL zamiast Q5, na 3 kartach zamiast 4, z RCCL i bez HIP graphs -- limit
  # implementacji, nie przepustowosci pamieci. Pomaga: profil GPU COMPUTE (+9 %, gpu-tuning.sh) i draft.
  # Draft MTP n-max 4 (bench_spec, 1 agent): srednio 69.6, narzedzia 78-97, tlumaczenie 80-86, kod 57-69,
  # proza 44-45 tok/s. DFlash2 (incoai, Q8_0) daje to samo (69.0; limit ~4 tokenow na krok przez QSA).
  # Pelny opis: ~/Desktop/local_agents_project/AGENTIC-MODELS-GUIDE.md
  # ctx 262144 + 2 sloty: brak VRAM na karcie 3 -> 131072 wspolne dla 2 slotow.
  # Sampling = Qwen "thinking" (temp 1.0, top_p 0.95, top_k 20).
  "qwen3.8-flash-next-llamacpp":
    name: "Fallback: Qwen3.8-Flash-Next on llama.cpp (4 GPU)"
    description: "Same smartest model on llama.cpp - use only if the radiance version misbehaves. All 4 GPUs, ~45-51 tok/s, 131k ctx. Unloads everything else."
    cmd: |
      /home/mkoniu/llama.cpp-e86f5fd/build/bin/llama-server --port ${PORT} --jinja --agent -fa on --ui-config-file /home/mkoniu/.config/llama-swap/ui/qwen3.8-flash-next-llamacpp.json --tools all --mcp-servers-config /home/mkoniu/.config/llama-swap/tools/mcp-web.json --cors-origins http://192.168.0.39:8080,http://localhost:8080,http://127.0.0.1:8080
      -m /home/mkoniu/models/qwen3.8-flash-next/UD-Q5_K_XL/Qwen3.8-Flash-Next-UD-Q5_K_XL-00001-of-00006.gguf
      -md /home/mkoniu/models/qwen3.8-flash-next/mtp-Qwen3.8-Flash-Next-Q8_0.gguf
      --spec-type draft-mtp --spec-draft-n-max 2
      -ngl 999 --split-mode layer --tensor-split 0.95,1,1,1.05 --ctx-size 131072 --kv-unified --parallel 2
      --load-mode dio
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0 --presence-penalty 0
    env:
      - "HIP_VISIBLE_DEVICES=0,1,2,3"
    ttl: 600

  # ---------------------------------------------------------------------------------------------
  # Gemma 4 26B-A4B (27 X 2026). MoE ~4B aktywnych, Google, Apache 2.0. Artificial Analysis index 17
  # (Qwen3.6-35B-A3B 18, gpt-oss-120b 12). Q8_0 (25 GiB, praktycznie bez strat) na JEDNEJ karcie, Vulkan.
  # llama-bench, 1 karta: Vulkan tg128 99.6 (ROCm 84.7); Q6_K_XL tylko +4 % (103.4) -> zostaje Q8_0.
  # Draft MTP (unsloth MTP/mtp-...-Q8_0.gguf, 0.43 GiB) + ngram-mod, bench_spec: srednio 169.9 tok/s
  # (sam MTP 162.6), narzedzia 182-191, kod 158-203, proza 127-132.
  # Karta 2 -> moze dzialac rownoczesnie z qwen3.6-35b-a3b (karta 1), patrz grupa "agents" na dole.
  # Sampling = zalecenie Google (temp 1.0, top_p 0.95, top_k 64).
  "gemma-4-26b-a4b":
    name: "#3 Gemma 4 26B-A4B - 1 GPU (llama.cpp Vulkan)"
    description: "Google MoE, good general/agent model on ONE card (GPU 2). ~135-145 tok/s chat, ~170 code/tool turns (MTP + n-gram draft); 2 agents ~93-116 each. 2 slots x 131k ctx. Starts in ~20 s. Unloads everything else."
    cmd: |
      /home/mkoniu/llama.cpp-0ce8cd1-vulkan/build/bin/llama-server --port ${PORT} --jinja --agent -fa on --ui-config-file /home/mkoniu/.config/llama-swap/ui/gemma-4-26b-a4b.json --tools all --mcp-servers-config /home/mkoniu/.config/llama-swap/tools/mcp-web.json --cors-origins http://192.168.0.39:8080,http://localhost:8080,http://127.0.0.1:8080
      -m /home/mkoniu/models/gemma-4-26b-a4b/gemma-4-26B-A4B-it-Q8_0.gguf
      -md /home/mkoniu/models/gemma-4-26b-a4b/MTP/mtp-gemma-4-26B-A4B-it-Q8_0.gguf
      --spec-type draft-mtp,ngram-mod --spec-draft-n-max 4
      -ngl 999 --ctx-size 131072 --kv-unified --parallel 2 --batch-size 2048 --ubatch-size 2048
      --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0
    env:
      - "GGML_VK_VISIBLE_DEVICES=2"
    ttl: 600
    aliases:
      - "gemma4"
      - "gemma"

# Grupy (27 X 2026). Domyslnie llama-swap trzyma jeden model naraz. Dwa modele agentowe z jednej karty
# (qwen3.6 na karcie 1, gemma4 na karcie 2) moga byc zaladowane RAZEM (swap: false). exclusive: true =
# zaladowanie modelu spoza grupy (np. qwen3.8, deepseek, pula x4 -- potrzebuja wszystkich kart) zwalnia grupe.

  # ================================================================ MODELE W DOCKERZE (28 X 2026)
  # llama-swap uruchamia je jak kazdy inny model: run-compose.sh startuje kontener, pokazuje jego log
  # i usuwa kontener, gdy llama-swap zwalnia model. Kontenery slucha tylko na 127.0.0.1 (LAN -> :8080).
  # Opis, pomiary i inne uklady: AGENTIC-MODELS-GUIDE.md.

  # Qwen3.8-Flash-Next na silniku RADIANCE: NAJMADRZEJSZY model, karty 0+1.
  # radiance = serwer C++/HIP pod RDNA4 (StillDeadcode). Plik .rad 114 GiB: eksperci 4-bit (codebook,
  # GPTQ), reszta int8, glowica MTP. Jakosc: KL vs bf16 0.024 na tekscie -- mniej niz roznica miedzy
  # dwiema implementacjami bf16 (0.040). Bezstratnie: --tp-wire exact i KV bf16 (szybsze niz autorskie
  # wht6/fp8). Zmierzone, temp 1.0: 1 agent 119-151 tok/s czat, 128-160 kod (14k ctx); 4 agentow po ~88.
  # RAM ~30 GiB (pula 8 GiB na karte + cache tablicy n-gramow czytanej z dysku). Tylko JEDEN model
  # radiance naraz. NIE uzywac TP=4: kazda karta przypina swoja pule -> 53 GiB RAM, system swapowal.
  "qwen3.8-flash-next":
    name: "#1 Qwen3.8-Flash-Next - smartest (radiance, 2 GPU)"
    description: "Smartest model here. Hard reasoning, coding, long agent tasks. radiance engine, GPU 0+1, 4-bit experts (near-lossless). ~120-145 tok/s chat, ~135 code (14k ctx); 4 agents ~89 each, 8 agents ~69 each. 200k ctx. Starts in ~30 s. Runs together with qwen3.6-35b-a3b (group duo). Uses ~30 GB RAM."
    cmd: |
      /home/mkoniu/.config/llama-swap/vllm/run-compose.sh /home/mkoniu/.config/llama-swap/radiance/flashnext.compose.yml
      PORT=${PORT} NAME=radiance-flashnext GPUS=0,1 TP=2 WIRE=exact KVDT=bf16 NGRAM=disk HOSTPOOL=8192 SEQS=8
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    ttl: 600
    aliases:
      - "qwen3.8"
      - "qwen38"
      - "smartest"

  # To samo bez odmow (abliteracja: orcarouter/Qwen3.8-Flash-Next-Uncensored), ten sam przepis .rad.
  "qwen3.8-flash-next-uncensored":
    name: "#1 Qwen3.8-Flash-Next Uncensored (radiance, 2 GPU)"
    description: "Same model with refusals removed (abliterated) - e.g. security research and pentest learning. radiance engine, GPU 0+1, ~120-150 tok/s, 200k ctx. ~30 GB RAM; do not run together with qwen3.8-flash-next."
    cmd: |
      /home/mkoniu/.config/llama-swap/vllm/run-compose.sh /home/mkoniu/.config/llama-swap/radiance/flashnext.compose.yml
      PORT=${PORT} NAME=radiance-flashnext-unc GPUS=0,1 TP=2 WIRE=exact KVDT=bf16 NGRAM=disk HOSTPOOL=8192 SEQS=8
      MODELDIR=/home/mkoniu/models/qwen3.8-flash-next-uncensored/radiance RADFILE=qwen3.8-next-flash-uncensored-fp8-iq4r-moe.rad
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    ttl: 600
    aliases:
      - "uncensored"

  # Qwen3.6-35B-A3B FP8 na vLLM "Radiance" (fork vLLM pod R9700), karty 2+3. Wagi FP8 (lepsze niz Q5
  # GGUF), KV bf16 (bezstratne; fp8 tutaj bez kalibracji), MTP. Temp 0.6 (Qwen: precise coding).
  # Zmierzone: 1 agent 135-146 tok/s, 8 agentow po ~86 (~690 lacznie). llama.cpp na 1 karcie: 100-111.
  "qwen3.6-35b-a3b":
    name: "#2 Qwen3.6-35B-A3B - fast agent (vLLM, 2 GPU)"
    description: "Fast, capable agent/coding model. vLLM, FP8 weights, GPU 2+3. ~140-170 tok/s 1 agent, 8 agents ~90 each (~720 total). 131k ctx. Cold start ~2-3 min. Runs together with qwen3.8-flash-next (group duo)."
    cmd: |
      /home/mkoniu/.config/llama-swap/vllm/run-compose.sh /home/mkoniu/.config/llama-swap/vllm/qwen3.6-fp8.compose.yml
      PORT=${PORT} NAME=qwen36-vllm GPUS=2,3 TP=2 SEQS=8 KVDT=auto MAXLEN=131072 CHAT_MODEL=qwen3.6-35b-a3b
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    useModelName: qwen3.6-35b-a3b
    ttl: 600
    aliases:
      - "qwen3.6"
      - "qwen36"

  # Ten sam model na 4 kartach (TP=4), do 16 agentow. Zmierzone: 1 agent 148-160, 8 po 85-100,
  # 12 po 74-83 (~920 tok/s lacznie). Zastapil pule 4 x llama.cpp (12 po 71, 677 lacznie).
  "qwen3.6-35b-a3b-x4":
    name: "#2 Qwen3.6-35B-A3B x4 - many agents (vLLM, 4 GPU)"
    description: "For 8-16 parallel agents. vLLM tensor-parallel on all 4 GPUs. ~140-245 tok/s 1 agent, 8 agents ~103 each (~830 total), 12 agents ~80-85 each (~950-1020 total). 131k ctx. Cold start ~2-3 min. Unloads everything else."
    cmd: |
      /home/mkoniu/.config/llama-swap/vllm/run-compose.sh /home/mkoniu/.config/llama-swap/vllm/qwen3.6-fp8.compose.yml
      PORT=${PORT} NAME=qwen36-vllm-x4 GPUS=0,1,2,3 TP=4 SEQS=16 KVDT=auto MAXLEN=131072 CHAT_MODEL=qwen3.6-35b-a3b-x4
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    useModelName: qwen3.6-35b-a3b
    concurrencyLimit: 20   # llama-swap domyslnie 10 -> przy 12 agentach 2 dostawaly HTTP 429
    ttl: 600
    aliases:
      - "qwen3.6-pool"
      - "qwen36-x4"

groups:
  # Najmadrzejszy (karty 0+1) i szybki agent (karty 2+3) dzialaja jednoczesnie.
  # Pozostale modele (Gemma, Bielik, zapasowy llama.cpp) przy zaladowaniu zwalniaja wszystko inne.
  duo:
    swap: false
    exclusive: true
    members:
      - "qwen3.8-flash-next"
      - "qwen3.6-35b-a3b"

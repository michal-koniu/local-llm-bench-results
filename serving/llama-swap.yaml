# Current llama-swap config of the reference rig (comments removed, home directory shown as ~).
# The exact command of every run is in its manifest.json (server.llama_swap.cmd). DeepSeek-V4-Flash-0731 was served with --parallel 1 until 2026-10-11, with --parallel 4 until 2026-10-19,
# and since then with a speculative-decoding draft and --split-mode tensor on 2 slots (see SPEC-DECODING.md); the previous layouts remain as ...-layerspec and ...-nospec.
# Entries with an explicit llama-server path use llama.cpp 0ce8cd1; the `server` macro still points at the older build 680a036.
# One model in VRAM at a time; each entry launches llama.cpp llama-server with the flags below.
# HIP_VISIBLE_DEVICES picks the GPUs; --tensor-split balances layers across them.
# --agent enables llama-server built-in tools for the web UI only; the benches use /v1/chat/completions,
# which never executes them.
healthCheckTimeout: 300

macros:
  server: "~/llama.cpp/build/bin/llama-server --port ${PORT} --jinja --agent -fa on"

models:
  "bielik-11b":
    cmd: |
      ${server}
      -m ~/models/bielik-11b/Bielik-11B-v3.0-Instruct.Q8_0.gguf
      -ngl 999 --ctx-size 32768 --load-mode dio
      --ubatch-size 2048
      --chat-template-file ~/.config/llama-swap/templates/bielik-11b-tools.jinja
    env:
      - "HIP_VISIBLE_DEVICES=0"
    ttl: 600
    aliases:
      - "bielik"

  "gpt-oss-20b":
    cmd: |
      ${server}
      -m ~/models/gpt-oss-20b/gpt-oss-20b-MXFP4.gguf
      -ngl 999 --ctx-size 131072 --load-mode dio
      --ubatch-size 2048
    env:
      - "HIP_VISIBLE_DEVICES=0"
    ttl: 600
    aliases:
      - "gpt-oss"

  "qwen3-32b":
    cmd: |
      ${server}
      -m ~/models/qwen3-32b/Qwen_Qwen3-32B-Q4_K_M.gguf
      -ngl 999 --ctx-size 32768 --load-mode dio
      --ubatch-size 1024
    env:
      - "HIP_VISIBLE_DEVICES=0"
    ttl: 600
    aliases:
      - "qwen3"

  "qwen3-next-80b":
    cmd: |
      ${server}
      -m ~/models/qwen3-next-80b/Q4_1/Qwen3-Next-80B-A3B-Instruct-Q4_1-00001-of-00002.gguf
      -ngl 999 --split-mode layer --tensor-split 0.9,1 --ctx-size 262144 --load-mode dio
      --ubatch-size 1024
    env:
      - "HIP_VISIBLE_DEVICES=0,1"
    ttl: 600
    aliases:
      - "qwen3-next"

  "gpt-oss-120b":
    cmd: |
      ${server}
      -m ~/models/gpt-oss-120b/gpt-oss-120b-MXFP4.gguf
      -ngl 999 --split-mode layer --tensor-split 1,1,1 --ctx-size 131072 --load-mode dio
      --ubatch-size 1024
    env:
      - "HIP_VISIBLE_DEVICES=0,1,2"
    ttl: 600
    aliases:
      - "gpt-oss-big"

  "laguna-s-2.1":
    cmd: |
      ${server}
      -m ~/models/laguna-s-2.1/UD-Q4_K_XL/Laguna-S-2.1-UD-Q4_K_XL-00001-of-00003.gguf
      -ngl 999 --split-mode layer --tensor-split 0.9,1,1.1 --ctx-size 262144 --load-mode dio
      --ubatch-size 2048
    env:
      - "HIP_VISIBLE_DEVICES=0,1,2"
    ttl: 600
    aliases:
      - "laguna"

  "qwen3-235b-q3":
    cmd: |
      ${server}
      -m ~/models/Qwen3-235B-A22B-GGUF/UD-Q3_K_XL/Qwen3-235B-A22B-UD-Q3_K_XL-00001-of-00003.gguf
      -ngl 999 --split-mode layer --tensor-split 0.95,1,1,1.05 --ctx-size 40960 --load-mode dio
      --batch-size 4096 --ubatch-size 4096
    env:
      - "HIP_VISIBLE_DEVICES=0,1,2,3"
    ttl: 600
    aliases:
      - "qwen3-235b"
      - "qwen3-235b-xl"
      - "qwen3-q3"

  "deepseek-v4-flash-0731":
    cmd: |
      ~/llama.cpp-0ce8cd1/build/bin/llama-server --port ${PORT} --jinja --agent -fa on
      -m ~/models/DeepSeek-V4-Flash-0731-GGUF/UD-IQ3_XXS/DeepSeek-V4-Flash-0731-UD-IQ3_XXS-00001-of-00004.gguf
      -md ~/models/DeepSeek-V4-Flash-0731-GGUF/DSpark/DeepSeek-V4-Flash-0731-DSpark.gguf
      --spec-type draft-dspark --spec-draft-n-max 3 --spec-draft-p-min 0
      --split-mode tensor -ctk f16 -ctv f16
      -ngl 999 --ctx-size 196608 --load-mode dio
      --parallel 2 --ubatch-size 512
      --temp 1.0 --top-p 1.0 --top-k 0 --min-p 0
    env:
      - "HIP_VISIBLE_DEVICES=0,1,2,3"
    ttl: 600
    aliases:
      - "deepseek-v4-flash"
      - "deepseek"
      - "deepseek-v4"
      - "deepseek-0731"
      - "deepseek-v4-0731"

  "deepseek-v4-flash-0731-layerspec":
    cmd: |
      ${server}
      -m ~/models/DeepSeek-V4-Flash-0731-GGUF/UD-IQ3_XXS/DeepSeek-V4-Flash-0731-UD-IQ3_XXS-00001-of-00004.gguf
      -md ~/models/DeepSeek-V4-Flash-0731-GGUF/DSpark/DeepSeek-V4-Flash-0731-DSpark.gguf
      --spec-type draft-dspark --spec-draft-n-max 3 --spec-draft-p-min 0
      --spec-draft-type-k q8_0 --spec-draft-type-v q8_0
      -ngl 999 --split-mode layer --tensor-split 0.97,1,0.92,1.11 --ctx-size 524288 --load-mode dio
      --parallel 4 --ubatch-size 512
      --temp 1.0 --top-p 1.0 --top-k 0 --min-p 0
    env:
      - "HIP_VISIBLE_DEVICES=0,1,2,3"
    ttl: 600

  "deepseek-v4-flash-0731-nospec":
    cmd: |
      ${server}
      -m ~/models/DeepSeek-V4-Flash-0731-GGUF/UD-IQ3_XXS/DeepSeek-V4-Flash-0731-UD-IQ3_XXS-00001-of-00004.gguf
      -ngl 999 --split-mode layer --tensor-split 0.97,1,0.92,1.11 --ctx-size 524288 --load-mode dio
      --parallel 4 --ubatch-size 1024
      --temp 1.0 --top-p 1.0 --top-k 0 --min-p 0
    env:
      - "HIP_VISIBLE_DEVICES=0,1,2,3"
    ttl: 600

  "gpt-oss-20b-cpu":
    cmd: |
      ${server}
      -m ~/models/gpt-oss-20b/gpt-oss-20b-MXFP4.gguf
      -ngl 0 -t 8 --ctx-size 32768
    env:
      - "HIP_VISIBLE_DEVICES="
    ttl: 900
